name: Build apps

# Builds a one-file Windows app and a macOS app whenever a version tag
# (v1.0.0, ...) is pushed, and attaches them to the GitHub Release.
# Can also be run by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: AudioVisualizer-windows.exe
          - os: macos-latest
            artifact: AudioVisualizer-mac.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest tests -q

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AudioVisualizer \
            --collect-submodules winrt --collect-all pyaudiowpatch --paths src packaging/entry.py
          mv dist/AudioVisualizer.exe "${{ matrix.artifact }}"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name AudioVisualizer \
            --collect-all sounddevice --collect-all _sounddevice_data --paths src packaging/entry.py
          # macOS asks for microphone permission (needed to hear music through the input device)
          plutil -insert NSMicrophoneUsageDescription -string "Listens to the music to draw the visualizer." \
            dist/AudioVisualizer.app/Contents/Info.plist
          codesign --force --deep --sign - dist/AudioVisualizer.app
          ditto -c -k --keepParent dist/AudioVisualizer.app "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
