name: Build apps

# Builds a one-file Windows app and a macOS app whenever a version tag
# (v1.0.0, ...) is pushed, and attaches them to the GitHub Release.
# Can also be run by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: AudioVisualizer-windows.exe
          - os: macos-latest
            artifact: AudioVisualizer-mac.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest tests -q

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # scipy is excluded on purpose: proc-tap only needs it for resampling we don't use
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AudioVisualizer \
            --collect-submodules winrt --collect-all pyaudiowpatch \
            --hidden-import proctap._native --collect-submodules proctap.backends \
            --collect-submodules pycaw --collect-submodules comtypes \
            --exclude-module scipy --exclude-module matplotlib --paths src packaging/entry.py
          mv dist/AudioVisualizer.exe "${{ matrix.artifact }}"

      - name: Build the system audio helper (macOS)
        if: runner.os == 'macOS'
        run: |
          # hears everything the Mac plays through a Core Audio tap (macOS 14.2+), no driver needed
          mkdir -p build/mac
          swiftc -O -target arm64-apple-macos14.2 packaging/mac/SystemAudioTap.swift -o build/mac/SystemAudioTap
          build/mac/SystemAudioTap --check

      - name: Try the helper on this machine (informational)
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: python
        run: |
          import subprocess, threading, time
          p = subprocess.Popen(["build/mac/SystemAudioTap"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          got = {"out": b"", "err": b""}
          def drain(name, pipe):
              for chunk in iter(lambda: pipe.read(65536), b""):
                  got[name] += chunk
          threads = [threading.Thread(target=drain, args=(n, s), daemon=True) for n, s in (("out", p.stdout), ("err", p.stderr))]
          [t.start() for t in threads]
          time.sleep(3)
          p.stdin.close()                       # the helper's cue to quit
          try:
              p.wait(10)
          except subprocess.TimeoutExpired:
              p.kill(); p.wait()
          [t.join(2) for t in threads]
          print("exit code", p.returncode, "| bytes", len(got["out"]), "| header", got["out"][:12])
          print(got["err"].decode(errors="replace")[-800:])

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name AudioVisualizer \
            --collect-all sounddevice --collect-all _sounddevice_data \
            --add-binary build/mac/SystemAudioTap:. --paths src packaging/entry.py
          # macOS asks once to record system audio (the tap), or for the microphone on older macOS
          plutil -insert NSAudioCaptureUsageDescription -string "Listens to what your Mac is playing to draw the visualizer." \
            dist/AudioVisualizer.app/Contents/Info.plist
          plutil -insert NSMicrophoneUsageDescription -string "Listens to the music to draw the visualizer." \
            dist/AudioVisualizer.app/Contents/Info.plist
          find dist/AudioVisualizer.app -name SystemAudioTap -perm -u+x | grep . \
            || { echo "SystemAudioTap missing from the app"; exit 1; }
          codesign --force --deep --sign - dist/AudioVisualizer.app
          ditto -c -k --keepParent dist/AudioVisualizer.app "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifact }}
